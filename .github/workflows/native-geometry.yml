name: Native CAD candidate experiment
on:
  push:
    branches: [main]
    paths:
      - "native/GeometryBridge/CandidateProbe/**"
      - "scripts/prepare-rotation-reference.cjs"
      - "tests/iOS.Native/**"
      - "tests/Smoke/**"
      - "src/Port/Geometry.Candidate/**"
      - "src/Port/Features.Candidate/**"
      - "tests/Port/Geometry.Candidate.Contracts/**"
      - "scripts/run-native-simulator.sh"
      - "scripts/ios-device.cjs"
      - ".github/workflows/native-geometry.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: b8f597c677811d1f9f4d8a97f5ae2825c0353a42
          path: .local/native/occt-source
          persist-credentials: false
      - name: Record pinned native source
        run: |
          mkdir -p artifacts
          git -C .local/native/occt-source rev-parse HEAD > artifacts/native-source.txt
          sha256sum .local/native/occt-source/LICENSE_LGPL_21.txt .local/native/occt-source/OCCT_LGPL_EXCEPTION.txt > artifacts/native-license-hashes.txt
      - name: Prepare pinned published rotation comparison
        run: node scripts/prepare-rotation-reference.cjs | tee artifacts/native-rotation-reference.json
      - name: Configure genuine modeling kernel
        run: cmake -S native/GeometryBridge/CandidateProbe -B .local/native/host -DCMAKE_BUILD_TYPE=Release -DOCCT_SOURCE_DIR="$PWD/.local/native/occt-source" | tee artifacts/native-configure.txt
      - name: Compile candidate API usage before kernel build
        run: cmake --build .local/native/host --target jewel_occt_candidate_objects --parallel 2 | tee artifacts/native-probe-compile.txt
      - name: Build analytical native fixture runner
        run: cmake --build .local/native/host --target occt_candidate_test --parallel 4 | tee artifacts/native-build.txt
      - name: Execute native analytical assertions
        run: .local/native/host/occt_candidate_test | tee artifacts/native-result.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-candidate-host-evidence
          path: artifacts/
          retention-days: 14
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: b8f597c677811d1f9f4d8a97f5ae2825c0353a42
          path: .local/native/occt-source
          persist-credentials: false
      - name: Pin Apple toolchain
        run: |
          echo '{"sdk":{"version":"10.0.302","rollForward":"disable"}}' > global.json
          sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.302.0
      - name: Record source and toolchain
        run: |
          mkdir -p artifacts
          git -C .local/native/occt-source rev-parse HEAD > artifacts/native-source.txt
          xcodebuild -version > artifacts/xcode.txt
          dotnet --info > artifacts/dotnet.txt
          shasum -a 256 .local/native/occt-source/LICENSE_LGPL_21.txt .local/native/occt-source/OCCT_LGPL_EXCEPTION.txt > artifacts/native-license-hashes.txt
      - name: Prepare pinned published rotation comparison
        run: node scripts/prepare-rotation-reference.cjs | tee artifacts/native-rotation-reference.json
      - name: Configure actual iOS simulator kernel
        run: cmake -S native/GeometryBridge/CandidateProbe -B .local/native/ios-sim -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DOCCT_SOURCE_DIR="$PWD/.local/native/occt-source" | tee artifacts/native-configure.txt
      - name: Compile candidate API usage before kernel build
        run: cmake --build .local/native/ios-sim --target jewel_occt_candidate_objects --parallel 2 | tee artifacts/native-probe-compile.txt
      - name: Build native kernel and test entry
        run: cmake --build .local/native/ios-sim --target jewel_occt_candidate --parallel 3 | tee artifacts/native-build.txt
      - name: Combine static test dependencies
        run: |
          libraries=()
          while IFS= read -r -d '' library; do libraries+=("$library"); done < <(find .local/native/ios-sim -name '*.a' -print0)
          test "${#libraries[@]}" -gt 1
          xcrun libtool -static -o .local/native/ios-sim-all.a "${libraries[@]}" 2>&1 | tee artifacts/native-merge.txt
      - name: Build signed native-execution test app
        run: dotnet build tests/iOS.Native -c Debug -r iossimulator-arm64 -p:EnableCodeSigning=true -p:CodesignKey=- -p:CodesignRequireProvisioningProfile=false -p:MtouchDebug=false -p:EnableDiagnostics=false | tee artifacts/native-app-build.txt
      - name: Execute native cases on iPad simulator
        timeout-minutes: 20
        run: bash scripts/run-native-simulator.sh ipad
      - name: Execute native cases on iPhone simulator
        timeout-minutes: 20
        run: bash scripts/run-native-simulator.sh iphone
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-candidate-ios-evidence
          path: artifacts/
          retention-days: 14
