name: Repository integrity and bounded proofs
on:
  push:
    branches: [main, codex/dotnet-ios-reuse]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Security scanner regression cases
        run: node --test tools/repository/security.test.cjs
      - name: Simulator selection regressions
        run: node --test tests/ios-device.test.cjs tests/simulator-launch.test.cjs
      - name: Verify full recovery, source links and work ledgers
        run: node tools/repository/check.cjs --record
      - name: Additional scalar reference-reader controls
        run: |
          node --test tests/scalar-v1-reference.test.cjs tests/ring-rail-v1-reference.test.cjs tests/outside-rail-v1-reference.test.cjs tests/matrix-profiles-reference.test.cjs tests/select-ring-rail-v1-reference.test.cjs tests/transform-producers-v1-reference.test.cjs tests/profile-placement-v1-reference.test.cjs tests/transform-consumers-v1-reference.test.cjs tests/collection-headers-v1-reference.test.cjs tests/sweep2-header-v1-reference.test.cjs
          node reference/file-proof/scalar-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/plain-scalar-reference.json
          node reference/file-proof/ring-rail-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/ring-rail-input-reference.json
          node reference/file-proof/outside-rail-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/outside-rail-input-reference.json
          node reference/file-proof/sweep2-header-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/sweep2-header-reference.json
          node reference/file-proof/collection-headers-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/collection-header-reference.json
          node reference/file-proof/transform-consumers-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/transform-consumer-reference.json
          node reference/file-proof/profile-placement-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/profile-placement-reference.json
          node reference/file-proof/transform-producers-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/transform-producer-reference.json
          node reference/file-proof/select-ring-rail-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/select-ring-rail-reference.json
          node reference/file-proof/matrix-profiles-v1.cjs --record
          git diff --exit-code -- docs/evidence/audit/matrix-profile-reference.json
      - name: Verify available library serialized type footprint
        run: node scripts/library-type-footprint.cjs --check
      - name: Build source and metadata audit tools
        run: |
          node scripts/run-local.cjs dotnet build tools/SourceAudit --nologo -v:q
          node scripts/run-local.cjs dotnet build tools/RecoveryMetadata --nologo -v:q
      - name: Verify unchanged reuse experiment
        run: node scripts/verify-sources.cjs
      - name: Production source provenance
        run: node scripts/verify-production.cjs
      - name: Prepare pinned published rotation comparison
        run: node scripts/prepare-rotation-reference.cjs
      - name: Numeric oracle provenance controls
        run: node --test tests/numeric-oracle.test.cjs tests/value-channel-oracle.test.cjs tests/select-rail-oracle.test.cjs tests/transform-producer-oracle.test.cjs tests/profile-placement-oracle.test.cjs tests/rotation-oracle.test.cjs tests/rotation-reference-source.test.cjs tests/consumer-sockets-oracle.test.cjs tests/array-oracle.test.cjs tests/collection-execution-oracle.test.cjs tests/array-query-oracle.test.cjs tests/curve-routing-oracle.test.cjs tests/sweep-preparation-oracle.test.cjs tests/brep-data-contracts.test.cjs
      - name: Verify recovered value-channel method oracle
        run: |
          node scripts/verify-value-channel-oracle.cjs
          node scripts/verify-select-rail-oracle.cjs
          node scripts/verify-transform-producer-oracle.cjs
          node scripts/verify-profile-placement-oracle.cjs
          node scripts/verify-rotation-oracle.cjs
          node scripts/verify-consumer-sockets-oracle.cjs
          node scripts/verify-array-oracle.cjs
          node scripts/verify-collection-execution-oracle.cjs
          node scripts/verify-array-query-oracle.cjs
          node scripts/verify-sweep-preparation-oracle.cjs
          node scripts/verify-curve-routing-oracle.cjs
          node scripts/verify-brep-data-contracts.cjs
      - name: Verify source-derived portfolio XML contracts
        run: node scripts/run-local.cjs dotnet run --project tools/PortfolioContractGenerator -- "$GITHUB_WORKSPACE" --verify
      - name: Graph snapshot contracts
        run: node scripts/run-local.cjs dotnet run --project tests/Port/Graph.Tests
      - name: Production domain material contract
        run: node scripts/run-local.cjs dotnet run --project tests/Port/Domain.Tests
      - name: Portable recovered checks with explicit compression diagnostic
        run: node scripts/run-local.cjs dotnet run --project tests/Console
      - name: Production legacy CSG structural round trip
        run: |
          node scripts/run-local.cjs dotnet run --project tests/Port/Documents.Tests -- .local/file-proof/production
          node scripts/run-local.cjs node scripts/check-production-csg.cjs
          node scripts/run-local.cjs node reference/file-proof/check-additional-scalars.cjs
      - name: Bounded real CSG edit and preservation proof
        run: node scripts/run-local.cjs node reference/file-proof/run-file-proof.cjs
      - name: Independent CSharp verification and negative CRC control
        run: node scripts/run-local.cjs node reference/file-proof/run-independent-check.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: repository-bounded-proof-evidence
          path: |
            .local/evidence/repository-check.json
            .local/file-proof/file-roundtrip-result.json
            .local/file-proof/independent-verification.json
            .local/file-proof/independent/*.log
            .local/file-proof/production/production-crosscheck.json
            .local/file-proof/production/independent/*.log
          retention-days: 14
