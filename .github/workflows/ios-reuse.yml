name: Recovered CSharp iOS reuse
on:
  push:
    branches: [main, codex/dotnet-ios-reuse]
    paths:
      - "src/**"
      - "tests/iOS/**"
      - "tests/Smoke/**"
      - "tests/Port/**"
      - "scripts/run-simulator.sh"
      - "scripts/ios-device.cjs"
      - "tests/ios-device.test.cjs"
      - ".github/workflows/ios-reuse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    name: iOS ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ipad","iphone","device"]' || '["ipad","iphone"]') }}
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin CI SDK for Xcode 26.6 workload set
        run: |
          echo '{"sdk":{"version":"10.0.302","rollForward":"disable"}}' > global.json
          sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Verify unchanged recovered sources
        run: node scripts/verify-sources.cjs
      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.302.0
      - name: Record toolchain
        run: |
          mkdir -p artifacts
          dotnet --info > artifacts/dotnet.txt
          dotnet workload list > artifacts/workloads.txt
          xcodebuild -version > artifacts/xcode.txt
          xcrun simctl list devices available > artifacts/simulators.txt
      - name: Portable runtime proof
        run: dotnet run --project tests/Console | tee artifacts/portable-smoke.txt
      - name: Build universal simulator test app
        id: simulator
        if: matrix.target != 'device'
        run: dotnet build tests/iOS -c Debug -r iossimulator-arm64 -p:EnableCodeSigning=true -p:CodesignKey=- -p:CodesignRequireProvisioningProfile=false -p:MtouchDebug=false -p:EnableDiagnostics=false -bl:artifacts/simulator.binlog | tee artifacts/simulator-build.txt
      - name: Run requested simulator family
        if: matrix.target != 'device'
        timeout-minutes: 8
        run: SIMULATOR_FAMILY=${{ matrix.target }} bash scripts/run-simulator.sh
      - name: Build unsigned device AOT app
        if: matrix.target == 'device'
        run: dotnet build tests/iOS -c Release -r ios-arm64 -p:EnableCodeSigning=false -p:BuildIpa=false -p:MtouchLink=SdkOnly -bl:artifacts/device.binlog | tee artifacts/device-build.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ios-reuse-evidence-${{ matrix.target }}
          path: artifacts/
          retention-days: 14
