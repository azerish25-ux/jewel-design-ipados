name: Metal renderer binding preflight
on:
  push:
    branches: [codex/dotnet-ios-reuse]
    paths:
      - "src/Port/Rendering.Candidate*/**"
      - "tests/iOS.Metal.Compile/**"
      - "tests/iOS.Viewport/**"
      - "tests/Port/Rendering.Tests/**"
      - "tests/Port/Geometry.Candidate.Contracts/LegacyCameraPresetAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Recovered/LegacyCameraPresets.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Recovered/CameraObservationTypes.txt"
      - "tests/Port/Geometry.Candidate.Contracts/Rhino5ScalarAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Rhino5CameraAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Rhino5ViewportAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Rhino5RotationAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Rhino5CameraLocationAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/camera-rotation-source-cases.json"
      - "scripts/prepare-camera-rotation-reference.cjs"
      - "scripts/generate-camera-rotation-cases.cjs"
      - "tests/camera-rotation-reference.test.cjs"
      - "native/Rendering/CameraRotationReference/**"
      - "scripts/run-ghidra-local.cjs"
      - "tests/ghidra-local.test.cjs"
      - "tests/fixtures/ghidra-script-failure.txt"
      - "scripts/verify-camera-preset-oracle.cjs"
      - "scripts/prepare-frustum-reference.cjs"
      - "scripts/prepare-viewport-projection-reference.cjs"
      - "scripts/generate-viewport-projection-cases.cjs"
      - "native/Rendering/ViewportProjectionReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/ViewportProjectionAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/viewport-projection-source-cases.json"
      - "scripts/prepare-camera-frame-reference.cjs"
      - "scripts/generate-camera-frame-cases.cjs"
      - "native/Rendering/CameraFrameReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/CameraFrameAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/camera-frame-source-cases.json"
      - "scripts/prepare-camera-matrix-reference.cjs"
      - "scripts/generate-camera-matrix-cases.cjs"
      - "native/Rendering/CameraMatrixReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/CameraMatrixAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/camera-matrix-source-cases.json"
      - "scripts/generate-frustum-cases.cjs"
      - "native/Rendering/FrustumReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/FrustumAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/frustum-source-cases.json"
      - "tests/iOS.Native/MetalViewportChecks.cs"
      - ".github/workflows/metal-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin existing Apple toolchain
        run: |
          echo '{"sdk":{"version":"10.0.302","rollForward":"disable"}}' > global.json
          sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install pinned iOS workload
        run: dotnet workload install ios --version 10.0.302.0
      - name: Verify pinned native frustum differentials
        run: |
          mkdir -p artifacts .local/native
          node scripts/prepare-frustum-reference.cjs --acquire > artifacts/frustum-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/frustum native/Rendering/FrustumReference/reference.cpp -o .local/native/frustum-reference
          node scripts/generate-frustum-cases.cjs .local/native/frustum-reference > artifacts/frustum-native-cases.json
      - name: Verify pinned camera matrix native differentials
        run: |
          node scripts/prepare-camera-matrix-reference.cjs --acquire > artifacts/camera-matrix-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -I .local/reference/camera-matrix native/Rendering/CameraMatrixReference/reference.cpp -o .local/native/camera-matrix-reference
          node scripts/generate-camera-matrix-cases.cjs .local/native/camera-matrix-reference > artifacts/camera-matrix-native-cases.json
      - name: Verify pinned camera frame state differentials
        run: |
          node scripts/prepare-camera-frame-reference.cjs --acquire > artifacts/camera-frame-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/camera-frame native/Rendering/CameraFrameReference/reference.cpp -o .local/native/camera-frame-reference
          node scripts/generate-camera-frame-cases.cjs .local/native/camera-frame-reference > artifacts/camera-frame-native-cases.json
      - name: Verify pinned joint viewport transition differentials
        run: |
          node scripts/prepare-viewport-projection-reference.cjs --acquire > artifacts/viewport-projection-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/viewport-projection native/Rendering/ViewportProjectionReference/reference.cpp -o .local/native/viewport-projection-reference
          node scripts/generate-viewport-projection-cases.cjs .local/native/viewport-projection-reference > artifacts/viewport-projection-native-cases.json
      - name: Verify pinned arbitrary-axis camera rotation
        run: |
          node scripts/prepare-camera-rotation-reference.cjs --acquire > artifacts/camera-rotation-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/camera-rotation native/Rendering/CameraRotationReference/reference.cpp -o .local/native/camera-rotation-reference
          node scripts/generate-camera-rotation-cases.cjs .local/native/camera-rotation-reference > artifacts/camera-rotation-native-cases.json
          node --test tests/camera-rotation-reference.test.cjs > artifacts/camera-rotation-regressions.txt
      - name: Execute source camera preset differential on macOS
        run: |
          mkdir -p artifacts
          node scripts/verify-camera-preset-oracle.cjs | tee artifacts/camera-source-fidelity.json
          dotnet run --project tests/Port/Rendering.Tests | tee artifacts/camera-preset-tests.txt
      - name: Verify D-only native-analysis launch contracts on macOS
        run: node --test tests/ghidra-local.test.cjs | tee artifacts/ghidra-local-contracts.txt
      - name: Compile real Metal binding library
        run: |
          mkdir -p artifacts
          dotnet build tests/iOS.Metal.Compile -c Debug -r iossimulator-arm64 | tee artifacts/metal-binding-build.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: metal-binding-preflight
          path: artifacts/
          retention-days: 14
