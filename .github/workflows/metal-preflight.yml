name: Metal renderer binding preflight
on:
  push:
    branches: [codex/dotnet-ios-reuse]
    paths:
      - "src/Port/Rendering.Candidate*/**"
      - "tests/iOS.Metal.Compile/**"
      - "tests/iOS.Viewport/**"
      - "tests/Port/Rendering.Tests/**"
      - "tests/Port/Geometry.Candidate.Contracts/LegacyCameraPresetAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Recovered/LegacyCameraPresets.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Recovered/CameraObservationTypes.txt"
      - "scripts/verify-camera-preset-oracle.cjs"
      - "scripts/prepare-frustum-reference.cjs"
      - "scripts/generate-frustum-cases.cjs"
      - "native/Rendering/FrustumReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/FrustumAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/frustum-source-cases.json"
      - "tests/iOS.Native/MetalViewportChecks.cs"
      - ".github/workflows/metal-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin existing Apple toolchain
        run: |
          echo '{"sdk":{"version":"10.0.302","rollForward":"disable"}}' > global.json
          sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install pinned iOS workload
        run: dotnet workload install ios --version 10.0.302.0
      - name: Verify pinned native frustum differentials
        run: |
          mkdir -p artifacts .local/native
          node scripts/prepare-frustum-reference.cjs --acquire > artifacts/frustum-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/frustum native/Rendering/FrustumReference/reference.cpp -o .local/native/frustum-reference
          node scripts/generate-frustum-cases.cjs .local/native/frustum-reference > artifacts/frustum-native-cases.json
      - name: Execute source camera preset differential on macOS
        run: |
          mkdir -p artifacts
          node scripts/verify-camera-preset-oracle.cjs | tee artifacts/camera-source-fidelity.json
          dotnet run --project tests/Port/Rendering.Tests | tee artifacts/camera-preset-tests.txt
      - name: Compile real Metal binding library
        run: |
          mkdir -p artifacts
          dotnet build tests/iOS.Metal.Compile -c Debug -r iossimulator-arm64 | tee artifacts/metal-binding-build.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: metal-binding-preflight
          path: artifacts/
          retention-days: 14
