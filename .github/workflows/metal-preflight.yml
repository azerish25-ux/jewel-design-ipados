      - "scripts/prepare-viewport-cache-reference.cjs"
      - "scripts/generate-viewport-cache-cases.cjs"
      - "tests/viewport-cache-reference.test.cjs"
      - "native/Rendering/ViewportCacheReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/camera-rotation-source-cases.json"
      - "scripts/prepare-camera-rotation-reference.cjs"
      - "scripts/generate-camera-rotation-cases.cjs"
      - "tests/camera-rotation-reference.test.cjs"
      - "native/Rendering/CameraRotationReference/**"
      - "scripts/run-ghidra-local.cjs"
      - "tests/ghidra-local.test.cjs"
      - "tests/fixtures/ghidra-script-failure.txt"
      - "scripts/check-viewport-capture-surface.cjs"
      - "scripts/run-viewport-simulator.sh"
      - "scripts/verify-wallpaper-raster-golden.cjs"
      - "scripts/verify-metal-artifacts.cjs"
      - "tests/viewport-capture-surface.test.cjs"
      - "tests/viewport-driver.test.cjs"
      - "tests/fixtures/viewport-iphone-system-banner.png"
      - "scripts/verify-camera-preset-oracle.cjs"
      - "scripts/prepare-frustum-reference.cjs"
      - "scripts/prepare-viewport-projection-reference.cjs"
      - "scripts/generate-viewport-projection-cases.cjs"
      - "native/Rendering/ViewportProjectionReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/ViewportProjectionAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/viewport-projection-source-cases.json"
      - "scripts/prepare-camera-frame-reference.cjs"
      - "scripts/generate-camera-frame-cases.cjs"
      - "native/Rendering/CameraFrameReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/CameraFrameAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/camera-frame-source-cases.json"
      - "scripts/prepare-camera-matrix-reference.cjs"
      - "scripts/generate-camera-matrix-cases.cjs"
      - "native/Rendering/CameraMatrixReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/CameraMatrixAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/camera-matrix-source-cases.json"
      - "scripts/generate-frustum-cases.cjs"
      - "native/Rendering/FrustumReference/**"
      - "tests/Port/Geometry.Candidate.Contracts/FrustumAssertions.cs"
      - "tests/Port/Geometry.Candidate.Contracts/Fixtures/frustum-source-cases.json"
      - "tests/iOS.Native/MetalViewportChecks.cs"
      - ".github/workflows/metal-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin existing Apple toolchain
        run: |
          echo '{"sdk":{"version":"10.0.302","rollForward":"disable"}}' > global.json
          sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install pinned iOS workload
        run: dotnet workload install ios --version 10.0.302.0
      - name: Verify pinned native frustum differentials
        run: |
          mkdir -p artifacts .local/native
          node scripts/prepare-frustum-reference.cjs --acquire > artifacts/frustum-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/frustum native/Rendering/FrustumReference/reference.cpp -o .local/native/frustum-reference
          node scripts/generate-frustum-cases.cjs .local/native/frustum-reference > artifacts/frustum-native-cases.json
      - name: Verify pinned camera matrix native differentials
        run: |
          node scripts/prepare-camera-matrix-reference.cjs --acquire > artifacts/camera-matrix-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -I .local/reference/camera-matrix native/Rendering/CameraMatrixReference/reference.cpp -o .local/native/camera-matrix-reference
          node scripts/generate-camera-matrix-cases.cjs .local/native/camera-matrix-reference > artifacts/camera-matrix-native-cases.json
      - name: Verify pinned camera frame state differentials
        run: |
          node scripts/prepare-camera-frame-reference.cjs --acquire > artifacts/camera-frame-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/camera-frame native/Rendering/CameraFrameReference/reference.cpp -o .local/native/camera-frame-reference
          node scripts/generate-camera-frame-cases.cjs .local/native/camera-frame-reference > artifacts/camera-frame-native-cases.json
      - name: Verify pinned joint viewport transition differentials
        run: |
          node scripts/prepare-viewport-projection-reference.cjs --acquire > artifacts/viewport-projection-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/viewport-projection native/Rendering/ViewportProjectionReference/reference.cpp -o .local/native/viewport-projection-reference
          node scripts/generate-viewport-projection-cases.cjs .local/native/viewport-projection-reference > artifacts/viewport-projection-native-cases.json
      - name: Verify pinned arbitrary-axis camera rotation
        run: |
          node scripts/prepare-camera-rotation-reference.cjs --acquire > artifacts/camera-rotation-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/camera-rotation native/Rendering/CameraRotationReference/reference.cpp -o .local/native/camera-rotation-reference
          node scripts/generate-camera-rotation-cases.cjs .local/native/camera-rotation-reference > artifacts/camera-rotation-native-cases.json
          node --test tests/camera-rotation-reference.test.cjs > artifacts/camera-rotation-regressions.txt
      - name: Verify pinned viewport cache matrix reference
        run: |
          node scripts/prepare-viewport-cache-reference.cjs --acquire > artifacts/viewport-cache-source.json
          clang++ -std=c++17 -O2 -ffp-contract=off -fno-strict-aliasing -I .local/reference/viewport-cache native/Rendering/ViewportCacheReference/reference.cpp -o .local/native/viewport-cache-reference
          node scripts/generate-viewport-cache-cases.cjs .local/native/viewport-cache-reference > artifacts/viewport-cache-native-cases.json
          node --test tests/viewport-cache-reference.test.cjs > artifacts/viewport-cache-regressions.txt
      - name: Verify original-derived wallpaper arithmetic golden
        run: node scripts/verify-wallpaper-raster-golden.cjs | tee artifacts/wallpaper-raster-golden.json
      - name: Execute source camera preset differential on macOS
        run: |
          mkdir -p artifacts
          node scripts/verify-camera-preset-oracle.cjs | tee artifacts/camera-source-fidelity.json
          dotnet run --project tests/Port/Rendering.Tests | tee artifacts/camera-preset-tests.txt
      - name: Verify D-only native-analysis launch contracts on macOS
        run: node --test tests/ghidra-local.test.cjs | tee artifacts/ghidra-local-contracts.txt
      - name: Verify actual capture obstruction and bounded driver regressions
        run: node --test tests/viewport-capture-surface.test.cjs tests/viewport-driver.test.cjs tests/wallpaper-screenshots.test.cjs | tee artifacts/capture-surface-regressions.txt
      - name: Verify retained public Windows GDI RGB corpus
        run: node --test tests/gdi-rgb-reference.test.cjs > artifacts/gdi-rgb-reference-checks.txt
      - name: Verify HALFTONE response and rejected approximation
        run: |
          node --test tests/halftone-response-reference.test.cjs > artifacts/halftone-response-checks.txt
          node scripts/halftone-response-reference.cjs analyze reference/fixtures/gdi-halftone-response-windows-26300.json > artifacts/halftone-rejected-model.json
      - name: Verify native-derived fixed HALFTONE reference domains
        run: |
          node --test tests/native-halftone-reference.test.cjs > artifacts/native-halftone-reference-checks.txt
          node scripts/halftone-fixed-reference.cjs response reference/fixtures/gdi-halftone-response-windows-26300.json > artifacts/native-halftone-response.json
          node scripts/halftone-fixed-reference.cjs raster reference/fixtures/gdi-rgb-windows-26300.json > artifacts/native-halftone-raster.json
      - name: Verify measured mixed HALFTONE reference domains
        run: |
          node --test tests/gdi-mixed-reference.test.cjs > artifacts/mixed-halftone-reference-checks.txt
          node scripts/halftone-mixed-reference.cjs reference/fixtures/gdi-mixed-windows-26300.json > artifacts/mixed-halftone-reference.json
      - name: Verify bounded small-source fixup and no-sharpen branches
        run: |
          node --test tests/gdi-fixup-reference.test.cjs > artifacts/fixup-halftone-reference-checks.txt
          node scripts/halftone-fixup-reference.cjs reference/fixtures/gdi-fixup-windows-26300.json > artifacts/fixup-halftone-reference.json
      - name: Verify measured large-source colour gate
        run: |
          node --test tests/gdi-large-fixup-reference.test.cjs > artifacts/large-fixup-halftone-reference-checks.txt
          node scripts/halftone-large-fixup-reference.cjs reference/fixtures/gdi-large-fixup-windows-26300.json.br > artifacts/large-fixup-halftone-reference.json
      - name: Verify composed native texture/source order corpus
        run: |
          node --test tests/composed-texture-reference.test.cjs > artifacts/composed-texture-reference-checks.txt
          node scripts/generate-composed-texture-gpu.cjs --check > artifacts/composed-texture-fixture-check.json
          node scripts/verify-composed-texture-reference.cjs reference/fixtures/gdi-composed-texture-windows-26300.json > artifacts/composed-texture-reference.json
      - name: Verify native enlargement/unity/depth-conversion domains
        run: |
          node --test tests/gdi-enlargement-reference.test.cjs > artifacts/gdi-enlargement-reference-checks.txt
          node scripts/halftone-enlargement-reference.cjs reference/fixtures/gdi-enlargement-windows-26300.json.br > artifacts/gdi-enlargement-reference.json
      - name: Verify original wallpaper native source pipeline
        run: |
          node --test tests/wallpaper-preparation-reference.test.cjs > artifacts/prepared-wallpaper-reference-checks.txt
          node scripts/verify-wallpaper-preparation-reference.cjs reference/fixtures/gdi-wallpaper-windows-26300.json.br > artifacts/prepared-wallpaper-reference.json
          node scripts/generate-wallpaper-gpu.cjs --check > artifacts/prepared-wallpaper-gpu-fixture.json
      - name: Verify original filename dependency facts
        run: |
          node --test tests/filename-reference.test.cjs > artifacts/filename-reference-checks.txt
          node scripts/verify-filename-reference.cjs reference/fixtures/windows-filename-semantics.json.br > artifacts/filename-reference.json
      - name: Verify original filename profile initialization evidence
        run: node scripts/verify-filename-profile.cjs > artifacts/filename-profile.json
      - name: Verify exhaustive native Unicode NLS1 lowercase corpus
        run: |
          node --test tests/nls-lower-reference.test.cjs > artifacts/unicode-nls-lower-reference-checks.txt
          node scripts/verify-nls-lower-reference.cjs > artifacts/unicode-nls-lower-reference.json
      - name: Compile real Metal binding library
        run: |
          mkdir -p artifacts
          dotnet build tests/iOS.Metal.Compile -c Debug -r iossimulator-arm64 | tee artifacts/metal-binding-build.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: metal-binding-preflight
          path: artifacts/
          retention-days: 14
